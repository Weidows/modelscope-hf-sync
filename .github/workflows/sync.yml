name: Sync ModelScope <-> HuggingFace

on:
  workflow_dispatch:
    inputs:
      direction:
        description: 'Sync direction'
        required: true
        type: choice
        options:
          - ms2hf
          - hf2ms
      repo_id:
        description: 'Source repo id, e.g. owner/name (must include the namespace)'
        required: true
        type: string
      repo_type:
        description: 'Repository type'
        required: true
        type: choice
        default: model
        options:
          - model
          - dataset
      revision:
        description: 'Branch / revision (leave empty for the platform default)'
        required: false
        type: string
        default: ''
      target_repo_id:
        description: 'Target repo id (leave empty to reuse the source repo_id)'
        required: false
        type: string
        default: ''
      private:
        description: 'Create the target repo as private'
        required: false
        type: boolean
        default: false
      allow_patterns:
        description: 'Comma-separated globs to include (empty = all files)'
        required: false
        type: string
        default: ''
      ignore_patterns:
        description: 'Comma-separated globs to exclude'
        required: false
        type: string
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MS_ENDPOINT: ${{ secrets.MS_ENDPOINT }}
        run: |
          set -euo pipefail
          ARGS=(--direction "${{ github.event.inputs.direction }}"
                --repo-id "${{ github.event.inputs.repo_id }}"
                --repo-type "${{ github.event.inputs.repo_type }}")
          REV="${{ github.event.inputs.revision }}"
          TGT="${{ github.event.inputs.target_repo_id }}"
          ALLOW="${{ github.event.inputs.allow_patterns }}"
          IGNORE="${{ github.event.inputs.ignore_patterns }}"
          [ -n "$REV" ]    && ARGS+=(--revision "$REV")
          [ -n "$TGT" ]    && ARGS+=(--target-repo-id "$TGT")
          [ -n "$ALLOW" ]  && ARGS+=(--allow-patterns "$ALLOW")
          [ -n "$IGNORE" ] && ARGS+=(--ignore-patterns "$IGNORE")
          [ "${{ github.event.inputs.private }}" = "true" ] && ARGS+=(--private)
          [ -n "$MS_ENDPOINT" ] && ARGS+=(--endpoint "$MS_ENDPOINT")
          python sync.py "${ARGS[@]}"

      - name: Report failure
        if: failure()
        run: echo "Sync failed - see the logs above for details."
